<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTracker - Chat</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      .chat-container{display:flex;flex-direction:column;height:calc(100vh - 140px)}
      .chat-messages{flex:1;overflow-y:auto;padding:12px;}
      .msg{max-width:85%;padding:10px 12px;border-radius:12px;margin:6px 0;line-height:1.4}
      .msg.user{background:#e8f1ff;align-self:flex-end}
      .msg.bot{background:#f5f5f5}
      .sending{opacity:.6}
    </style>
</head>
<body class="app">
    <header class="top-nav">
        <button class="nav-btn" onclick="window.location.href='notifications.html'">🔔</button>
        <h1>AI Assistant</h1>
        <button class="nav-btn" onclick="window.location.href='profile.html'">👤</button>
    </header>
    
    <main class="page">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div style="text-align: center; color: #666; margin-top: 50px;">
                    <p>👋 Hi! I'm your fitness assistant.</p>
                    <p>Ask me about nutrition, workouts, or your goals!</p>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type your message...">
                <button class="send-btn" onclick="sendMessage()">→</button>
            </div>
        </div>
    </main>
    
    <nav class="bottom-nav">
        <button class="nav-item" onclick="window.location.href='dashboard.html'">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" onclick="window.location.href='log-food.html'">
            <span class="nav-icon">🍎</span>
            <span class="nav-label">Log Food</span>
        </button>
        <button class="nav-item active">
            <span class="nav-icon">💬</span>
            <span class="nav-label">Chat</span>
        </button>
        <button class="nav-item" onclick="window.location.href='activity.html'">
            <span class="nav-icon">🏃</span>
            <span class="nav-label">Activity</span>
        </button>
    </nav>
    <script>
(function(){
  const API_URL = 'https://lance-flow.vercel.app/fitness';
  const chat = document.getElementById('chatMessages');
  const input = document.getElementById('messageInput');

  function addMessage(text, who){
    if(!text) return;
    const div = document.createElement('div');
    div.className = 'msg ' + (who === 'user' ? 'user' : 'bot');
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage(){
    const q = (input.value || '').trim();
    if(!q) return;
    addMessage(q, 'user');
    input.value = '';

    try{
      chat.classList.add('sending');
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: q })
      });
      const data = await res.json();
      const answer = (data && (data.response || data.answer || data.text)) || 'No answer returned.';
      addMessage(String(answer), 'bot');
    }catch(err){
      console.error(err);
      addMessage('Sorry, something went wrong. Please try again.', 'bot');
    }finally{
      chat.classList.remove('sending');
    }
  }

  // expose for the button onclick
  window.sendMessage = sendMessage;

  // Enter to send
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
})();
</script>
