<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTracker - Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="logo">🏃‍♀️</div>
            <h1>Join 254Fit</h1>
            <p>Start your fitness journey today</p>
            
            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>
                
                <button type="submit" class="btn-primary">Create Account</button>
                <div class="auth-alt">
                    <p style="margin:12px 0 0 0; font-size:14px;">Already have an account? <a href="signin.html">Sign in</a></p>
                    <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
                        <button type="button" id="googleSignUp" class="btn-secondary" style="flex:1; min-width:200px">Continue with Google</button>
                        <button type="button" id="linkGoogleFit" class="btn-secondary" style="flex:1; min-width:200px">Link Google Fit</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    
    <script type="module" src="auth.js"></script>
</body>
</html>
