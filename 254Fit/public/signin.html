<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTracker - Sign In</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="form-card">
      <div class="logo">🏃‍♀️</div>
      <h1>Welcome back</h1>
      <p>Sign in to continue</p>

      <form id="signinForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>

        <div class="auth-alt">
          <p style="margin:12px 0 0 0; font-size:14px;">Don’t have an account? <a href="index.html">Create one</a></p>
          <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" id="googleSignIn" class="btn-secondary" style="flex:1; min-width:200px">Continue with Google</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
